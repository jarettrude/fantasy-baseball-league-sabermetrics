server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    charset utf-8;

    # Use the client IP forwarded by Traefik
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff2;

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Aggressive caching for static/hashed Astro assets
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|otf|eot|json|xml|txt|webmanifest|map)$ {
        expires 1y;
        access_log off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
